name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install just
        run: npm install -g just
      - run: npm ci
      - name: Check (lint, typecheck, tests, build, openspec validate)
        run: just check
